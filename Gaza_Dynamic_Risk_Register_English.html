function t(k){return (T[lang]||T.en)[k]||k}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function txt(r,k){return lang==='ar'?(r.ar?.[k]||r[k]||''):(r[k]||'')}
function langBand(s){return lang==='ar'?({High:'مرتفع',Significant:'مهم',Moderate:'متوسط',Low:'منخفض'})[s]||s:s}
function matrix(l,i){let cell=[["Low","Low","Moderate","Significant","Significant"],["Low","Low","Moderate","Significant","High"],["Low","Moderate","Significant","High","High"],["Moderate","Significant","Significant","High","High"],["Significant","Significant","High","High","High"]];return cell[Math.max(1,Math.min(5,l))-1][Math.max(1,Math.min(5,i))-1]}
function recalc(r){for(let [p,l,i] of [['in','inL','inI'],['cur','curL','curI'],['tar','tarL','tarI']]){r[p+'Score']=Number(r[l])*Number(r[i]);r[p+'Band']=matrix(Number(r[l]),Number(r[i]))}}
function statusKey(s){if(!s)return'Proposed';if(/complete|مكتمل/i.test(s))return'Complete';if(/progress|تنفيذ/i.test(s))return'Ongoing';if(/hold|معلق/i.test(s))return'Hold';return'Proposed'}

function rating(b,score){return `<span class="pill ${String(b).toLowerCase()}">${esc(langBand(b))} · ${score}</span>`}

function filterRows(){let q=searchTerm.trim().toLocaleLowerCase();return risks[tab].filter(r=>(bandFilter==='all'||r.curBand===bandFilter)&&(statusFilter==='all'||statusKey(r.treatmentStatus)===statusFilter)&&(!q||[r.id,r.risk,r.ar?.risk,r.category,r.indicator,r.ar?.indicator,r.owner,r.ar?.owner].join(' ').toLocaleLowerCase().includes(q)))}
function drawTable(){let arr=filterRows();el('resultCount').textContent=arr.length+' '+t('active');el('tableRows').innerHTML=arr.map(r=>`<tr><td><span class="code">${esc(r.id)}</span></td><td class="riskTitle">${esc(txt(r,'risk'))}<div class="small">${esc(r.category)}</div></td><td>${rating(r.inBand,r.inScore)}</td><td>${rating(r.curBand,r.curScore)}</td><td>${rating(r.tarBand,r.tarScore)}</td><td>${esc(statusText(r.treatmentStatus))}</td><td>${esc(txt(r,'owner'))}</td><td><button class="btn mini" onclick="openDetail('${esc(r.id)}')">${t('open')}</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">${t('noResults')}</td></tr>`}
function riskView(){return `${scoreBoxes()}<div class="panel"><div class="row"><div><h2 class="sectionTitle">${t('riskList')}</h2><p class="desc">${t('riskDesc')}</p></div>${buttons()}</div><div class="filters"><input id="search" class="inp search" placeholder="${t('search')}" value="${esc(searchTerm)}" oninput="searchTerm=this.value;drawTable()"><select class="inp" onchange="bandFilter=this.value;drawTable()"><option value="all">${t('all')}</option>${['High','Significant','Moderate','Low'].map(x=>`<option value="${x}" ${bandFilter===x?'selected':''}>${langBand(x)}</option>`).join('')}</select><select class="inp" onchange="statusFilter=this.value;drawTable()"><option value="all">${t('allStatus')}</option>${['Proposed','Ongoing','Complete','Hold'].map(x=>`<option value="${x}" ${statusFilter===x?'selected':''}>${t('status'+x)}</option>`).join('')}</select><span id="resultCount" class="small"></span></div><div class="tableScroll"><table class="data"><thead><tr>${['num','risk','inherent','current','target','status','owner','actions'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody id="tableRows"></tbody></table></div><p class="notice">${t('saveNotice')}</p></div><div id="inspector" class="panel"></div>`}
function field(label,v){return `<div class="field"><strong>${t(label)}</strong>${esc(v||'—')}</div>`}
function openDetail(id){let r=risks[tab].find(x=>x.id===id);if(!r)return; editing=id;el('inspector').innerHTML=`<div class="row"><h2 class="sectionTitle">${t('bowtie')} — <span class="code">${esc(id)}</span></h2><button class="btn primary" onclick="openEditor('${esc(id)}')">✎ ${t('edit')}</button></div><p class="desc">${esc(txt(r,'risk'))}</p><div class="bt"><div class="btBox"><span class="btLabel">1 · ${t('cause')}</span>${esc(txt(r,'causes'))}<hr><span class="btLabel">${t('prevent')}</span>${esc(txt(r,'baseline'))}</div><div class="btBox center"><span class="btLabel">2 · ${t('event')}</span><b>${esc(txt(r,'risk'))}</b><div class="dotline"></div>${rating(r.curBand,r.curScore)}<div class="small" style="margin-top:8px">${t('ref')}: ${esc(r.bowtie)}</div></div><div class="btBox last"><span class="btLabel">3 · ${t('consequence')}</span>${esc(txt(r,'impacts'))}<hr><span class="btLabel">${t('mitigate')}</span>${esc(txt(r,'treatment'))}</div></div><div class="fields">${field('indicator',txt(r,'indicator'))}${field('trigger',txt(r,'trigger'))}${field('action',txt(r,'action'))}${field('owner',txt(r,'owner'))}${field('review',r.review)}${field('validation',r.validation)}${field('deadline',r.deadline)}${field('nextReview',r.nextReview)}</div><div class="status"><b>${t('dynamic')}:</b> ${t('loop')}</div>`;el('inspector').scrollIntoView({behavior:'smooth',block:'nearest'})}
const keysText=['risk','causes','impacts','baseline','treatment','indicator','trigger','action','owner'];
function inputControl(id,label,val,wide=false){return `<label class="${wide?'wide':''}">${t(label)}<textarea name="${id}">${esc(val)}</textarea></label>`}
function openEditor(id){let r=risks[tab].find(x=>x.id===id);if(!r)return;let fields=`<label class="wide">${t('risk')}<textarea name="risk">${esc(txt(r,'risk'))}</textarea></label>`+['causes','impacts','baseline','treatment','indicator','trigger','action','owner'].map(k=>inputControl(k,k,txt(r,k),true)).join('');let statuses=['Proposed','Ongoing','Complete','Hold'];el('editHolder').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeEditor()"><section class="dialog"><div class="row"><h2>${t('edit')}: ${esc(id)}</h2><button class="btn" onclick="closeEditor()">✕</button></div><p class="muted">${t('saveNotice')}</p><form id="riskEditForm" onsubmit="saveEdit(event,'${esc(id)}')"><div class="editGrid">${fields}<label>${t('curL')}<select name="curL">${[1,2,3,4,5].map(n=>`<option ${r.curL==n?'selected':''}>${n}</option>`).join('')}</select></label><label>${t('curI')}<select name="curI">${[1,2,3,4,5].map(n=>`<option ${r.curI==n?'selected':''}>${n}</option>`).join('')}</select></label><label>${t('tarL')}<select name="tarL">${[1,2,3,4,5].map(n=>`<option ${r.tarL==n?'selected':''}>${n}</option>`).join('')}</select></label><label>${t('tarI')}<select name="tarI">${[1,2,3,4,5].map(n=>`<option ${r.tarI==n?'selected':''}>${n}</option>`).join('')}</select></label><label>${t('status')}<select name="treatmentStatus">${statuses.map(s=>`<option value="${s}" ${statusKey(r.treatmentStatus)===s?'selected':''}>${t('status'+s)}</option>`).join('')}</select></label><label>${t('review')}<input name="review" value="${esc(r.review)}"></label><label>${t('deadline')}<input type="date" name="deadline" value="${esc(r.deadline)}"></label><label>${t('nextReview')}<input type="date" name="nextReview" value="${esc(r.nextReview)}"></label><label>${t('verified')}<input type="date" name="lastVerified" value="${esc(r.lastVerified)}"></label><label>${t('validation')}<input name="validation" value="${esc(r.validation)}"></label></div><div class="actions" style="justify-content:flex-end"><button class="btn" type="button" onclick="closeEditor()">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></div></form></section></div>`}
function closeEditor(){el('editHolder').innerHTML=''}
function saveEdit(e,id){e.preventDefault();let r=risks[tab].find(x=>x.id===id);let form=new FormData(e.target);for(let k of keysText){let v=String(form.get(k)||'');if(lang==='ar'){r.ar=r.ar||{};r.ar[k]=v}else{r[k]=v}}for(let k of ['curL','curI','tarL','tarI'])r[k]=Number(form.get(k));for(let k of ['review','deadline','nextReview','lastVerified','validation'])r[k]=String(form.get(k)||'');r.treatmentStatus=String(form.get('treatmentStatus'))+' – updated locally';recalc(r);save();closeEditor();render();openDetail(id)}
function firmView(){let total=risks.firm.reduce((a,f)=>a+Number(f.score),0);return `<div class="panel"><div class="row"><div><h2 class="sectionTitle">${t('tabFIRM')} — ${total}/20</h2><p class="desc">${t('firmDesc')}</p></div>${buttons()}</div><div class="firmGrid">${risks.firm.map(f=>`<div class="firm"><h3>${esc(txt(f,'component'))}</h3><span class="small">${esc(txt(f,'context'))}</span><div class="meter"><span style="width:${20*Number(f.score)}%"></span></div><b>${f.score}/5</b><p>${esc(txt(f,'drivers'))}</p><p><b>${t('response')}:</b> ${esc(txt(f,'response'))}</p><p><b>${t('indicator')}:</b> ${esc(txt(f,'indicator'))}</p><p><b>${t('owner')}:</b> ${esc(txt(f,'owner'))}</p></div>`).join('')}</div></div>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=t('title');el('root').innerHTML=header()+`<main><div class="wrap"><nav class="tabs"><button class="tab ${tab==='swm'?'active':''}" onclick="switchTab('swm')">♻ ${t('tabSW')} (18)</button><button class="tab ${tab==='recovery'?'active':''}" onclick="switchTab('recovery')">⌂ ${t('tabRC')} (16)</button><button class="tab ${tab==='firm'?'active':''}" onclick="switchTab('firm')">▦ ${t('tabFIRM')}</button></nav>${tab==='firm'?firmView():riskView()}<p class="foot">${t('footer')}</p></div></main><div id="editHolder"></div>`;if(tab!=='firm')drawTable()}
function filename(ext){return `Gaza_${tab==='swm'?'SolidWaste':tab==='recovery'?'Reconstruction':'FIRM'}_RiskRegister_${lang.toUpperCase()}.${ext}`}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},400)}
function exportJson(){download(new Blob([JSON.stringify(risks,null,2)],{type:'application/json;charset=utf-8'}),'Gaza_Risk_Data_Backup.json')}
function importJson(e){let f=e.target.files?.[0];if(!f)return;f.text().then(s=>{let obj=JSON.parse(s);if(!Array.isArray(obj.swm)||!Array.isArray(obj.recovery)||obj.swm.length<1||obj.recovery.length<1)throw Error(t('invalid'));if(!confirm(t('importConfirm')))return;risks=obj;risks.firm=risks.firm||INITIAL.firm;save();render()}).catch(err=>alert(t('invalid')+': '+err.message));e.target.value=''}
function resetData(){if(confirm(t('resetConfirm'))){risks=structuredClone(INITIAL);save();render()}}
function sheetData(){if(tab==='firm')return [[t('category'),t('context'),t('score'),t('drivers'),t('response'),t('indicator'),t('owner')],...risks.firm.map(f=>[txt(f,'component'),txt(f,'context'),f.score,txt(f,'drivers'),txt(f,'response'),txt(f,'indicator'),txt(f,'owner')])];let heads=['id','risk','category','causes','impacts','inL','inI','inScore','inBand','baseline','curL','curI','curScore','curBand','treatment','tarL','tarI','tarScore','tarBand','indicator','trigger','action','owner','review','nextReview','deadline','lastVerified','treatmentStatus','validation','assumptions','bowtie','recordDate'];let labels={id:t('id'),risk:t('risk'),category:t('category'),causes:t('causes'),impacts:t('impacts'),inL:'Inherent L',inI:'Inherent I',inScore:t('inherent')+' score',inBand:t('inherent')+' rating',baseline:t('baseline'),curL:t('curL'),curI:t('curI'),curScore:t('current')+' score',curBand:t('current')+' rating',treatment:t('treatment'),tarL:t('tarL'),tarI:t('tarI'),tarScore:t('target')+' score',tarBand:t('target')+' rating',indicator:t('indicator'),trigger:t('trigger'),action:t('action'),owner:t('owner'),review:t('review'),nextReview:t('nextReview'),deadline:t('deadline'),lastVerified:t('verified'),treatmentStatus:t('status'),validation:t('validation'),assumptions:t('assumptions'),bowtie:t('bowRef'),recordDate:t('recordDate')};return [heads.map(k=>labels[k]),...risks[tab].map(r=>heads.map(k=>['risk','causes','impacts','baseline','treatment','indicator','trigger','action','owner'].includes(k)?txt(r,k):['inBand','curBand','tarBand'].includes(k)?langBand(r[k]):k==='treatmentStatus'?statusText(r[k]):r[k]??''))]}
function exportCsv(){let arr=sheetData();let csv=arr.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),filename('csv'))}
function exportExcel(){let arr=sheetData();let escxml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));let rows=arr.map((row,ix)=>'<Row>'+row.map(v=>`<Cell${ix===0?' ss:StyleID="h"':''}><Data ss:Type="${typeof v==='number'?'Number':'String'}">${escxml(v)}</Data></Cell>`).join('')+'</Row>').join('');let xml=`<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#12526A" ss:Pattern="Solid"/></Style></Styles><Worksheet ss:Name="${tab==='firm'?'FIRM':tab==='swm'?'Solid_Waste':'Recovery'}"><Table>${rows}</Table></Worksheet></Workbook>`;download(new Blob(['\ufeff',xml],{type:'application/vnd.ms-excel;charset=utf-8'}),filename('xls'))}
render();
</script></body></html>
